spring:
  application:
    name: unified-system
  profiles:
    active: dev
  datasource:
    dynamic:
      primary: system
      strict: true
      datasource:
        system:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/unified_system_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: unified_app
          password: unified123
        production:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/unified_production_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: unified_app
          password: unified123
        logistics:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/unified_logistics_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: unified_app
          password: unified123
        sales:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/unified_sales_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: unified_app
          password: unified123
        finance:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/unified_finance_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: unified_app
          password: unified123
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: redis_app
      password: unified123
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  # 热插拔（IDEA 编译保存后自动重启；生产打包/非开发环境自动失效）
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

server:
  port: 8080

logging:
  level:
    com.unified: debug
    com.baomidou.dynamic: debug

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

jwt:
  secret: unifiedsystem-jwt-secret-key-min-length-256bit
  expiration: 86400000
  refresh-expiration: 604800000

app:
  price-anomaly:
    mild-threshold: 0.85
    moderate-threshold: 0.70
    severe-threshold: 0.50
  workflow:
    purchase:
      small-limit: 5000
      medium-limit: 50000
      large-limit: 200000
    expense:
      small-limit: 2000
      medium-limit: 10000

# API 文档（springdoc-openapi）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 健康检查与指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
